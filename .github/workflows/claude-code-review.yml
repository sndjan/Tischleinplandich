name: Claude Code Review

on:
  pull_request:
    # Not on every push: each review costs usage. Ask for another one with
    # "@claude review" in a comment (claude.yml).
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip drafts and bot PRs (Dependabot version bumps are covered by CI).
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The code-review plugin also checks the diff against CLAUDE.md, which holds
      # this repo's security rules (safeFetch, withSafeLinks, RLS, Datenschutz).
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
